{% extends "base.html" %}
{% block title %}Ingresar — Looks{% endblock %}
{% block top_actions %}<a href="/">Reservar</a>{% endblock %}

{% block content %}
<main>
  <div class="login-wrap">
    <div class="login-card">
      <h2>Ingresar</h2>
      <p>Acceso para mesa de entrada (el encargado del local).</p>
      <form id="form-login" onsubmit="return login(event)">
        <label>Usuario
          <input type="text" id="username" required autocomplete="username">
        </label>
        <label>Contraseña
          <input type="password" id="password" required autocomplete="current-password">
        </label>
        <div id="mensaje-login"></div>
        <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}

{% block extra_scripts %}
<script>
function esc(str) { const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML; }

async function login(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('mensaje-login');
  msg.innerHTML = '';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'No se pudo ingresar');
    window.location.href = '/mesa';
  } catch (err) {
    msg.innerHTML = `<div class="error-msg">${esc(err.message)}</div>`;
  }
  return false;
}
</script>
{% endblock %}
