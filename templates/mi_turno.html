{% extends "base.html" %}
{% block title %}Mi turno — Looks{% endblock %}
{% block top_actions %}<a href="/">Reservar</a>{% endblock %}

{% block content %}
<main>
  <div class="wrap" style="max-width:560px;">
    <section class="section-tight">
      <div class="section-head">
        <h2>Buscá tu turno</h2>
        <p>Ingresá el teléfono con el que reservaste.</p>
      </div>

      <form class="panel" id="form-buscar" onsubmit="return buscarTurno(event)">
        <label style="display:block;margin-bottom:14px;font-size:.85rem;color:rgba(27,25,38,.6);">
          Teléfono
          <input type="tel" id="input-telefono" required placeholder="Ej: 260-4123456"
            style="width:100%;margin-top:6px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);font-family:inherit;">
        </label>

        <div id="mensaje-buscar"></div>
        <button class="btn btn-primary btn-block" type="submit">Buscar turno</button>
      </form>

      <div id="resultado-turno" style="margin-top:20px;"></div>
    </section>
  </div>
</main>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/mi-turno.js') }}"></script>
{% endblock %}
